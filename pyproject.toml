[project]
name = "ai-vision-service"
version = "0.1.0"
description = "Lychee AI Vision Service – facial recognition microservice"
readme = "README.md"
license = { text = "MIT License" }
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28",
    # deepface runs on its base onnxruntime dependency; installing tensorflow would make it switch engines.
    "deepface>=0.0.103",
    # deepface requires opencv-python (not headless) as a transitive dependency.
    # The headless variant cannot be used here because uv treats them as conflicting packages.
    # The Dockerfile installs libgl1/libglib2.0-0 to satisfy opencv-python's system requirements.
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
    "sqlite-vec>=0.1",
    "psycopg2-binary>=2.9",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    # deepface imports werkzeug unconditionally but only declares it through its optional `api` extra.
    "werkzeug>=3.1.9",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "ty>=0.0.68",
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "pytest-asyncio>=1.4.0",
    "anyio>=4.14.2",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff – linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]
ignore = [
    "B008",   # FastAPI requires Depends() calls in function default arguments
    "ANN401", # typing.Any needed for numpy array and deepface return type annotations
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# ty – type checking
# ---------------------------------------------------------------------------
[tool.ty]
# ty inherits Python version from requires-python

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
